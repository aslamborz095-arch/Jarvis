name: Appli Android Jarvis
on:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.11.1" }
      - name: SDK Android déjà présent sur le serveur
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties && yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Construire l'APK
        working-directory: android
        run: gradle assembleRelease --no-daemon
      - name: Publier l'APK (release « android »)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk Jarvis.apk
          gh release delete android -y --cleanup-tag || true
          gh release create android Jarvis.apk --title "Jarvis Android" --notes "Appli Android Jarvis (build ${{ github.run_number }})" --latest
